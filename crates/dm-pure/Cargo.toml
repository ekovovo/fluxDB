[package]
name = "dm-pure"
version = "1.2.4"
edition = "2021"
description = "纯 Rust 实现的达梦 DM8 数据库驱动：DM 网络协议（握手/登录/执行/参数绑定/LOB/事务/分批 fetch），零外部数据库依赖"
license = "MIT"
authors = ["zhangtao"]
readme = "README.md"
repository = "https://github.com/zhangtao103239/dm8_pure_rs"
homepage = "https://github.com/zhangtao103239/dm8_pure_rs"
documentation = "https://docs.rs/dm-pure"
keywords = ["dameng", "dm8", "database", "driver", "protocol"]
categories = ["database", "database-implementations"]
rust-version = "1.70"
exclude = ["NEXT.md"]

[lib]
name = "dm_pure"
path = "src/lib.rs"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
md5 = "0.7"
des = "0.8"
aes = "0.8"
cipher = "0.4"
encoding_rs = "0.8"

[profile.release]
opt-level = 3

[package.metadata.docs.rs]
all-features = true
