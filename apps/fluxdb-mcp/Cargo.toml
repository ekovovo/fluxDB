[package]
name = "fluxdb-mcp"
version = "0.1.0"
edition = "2024"
description = "fluxDB 对外本地 MCP Server（stdio）"

[[bin]]
name = "fluxdb-mcp"
path = "src/main.rs"

[dependencies]
# 共用应用/领域/存储能力：不依赖 GPUI，也不启动内部主模型。
fluxdb-app = { path = "../../crates/fluxdb-app" }
fluxdb-core = { path = "../../crates/fluxdb-core" }
fluxdb-storage = { path = "../../crates/fluxdb-storage" }
# 官方 MCP Rust SDK（stdio 传输、typed tools、协议协商）。
rmcp = { version = "1.8", default-features = false, features = ["server", "transport-io", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
