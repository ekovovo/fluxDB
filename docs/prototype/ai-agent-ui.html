<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>fluxDB · AI Agent 交互稿</title>
  <link rel="stylesheet" href="ai-agent-ui.css">
  <script src="ai-agent-ui-pages.js" defer></script>
  <script src="ai-agent-ui.js" defer></script>
</head>
<body>
<div id="fluxdb-prototype" class="app-shell">
  <header class="app-header">
    <div class="window-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <img class="brand-icon" src="../../apps/fluxdb-desktop/assets/app-icon.svg" alt="">
    <strong class="brand">fluxDB</strong><span class="header-divider"></span>
    <span class="header-path" id="header-path">数据库工作台</span>
    <span class="prototype-tag">AI Agent 交互稿</span>
    <div class="header-actions">
      <button class="button ghost" data-action="scene-menu" aria-label="选择交互场景"><span class="icon" data-icon="workflow"></span><span>场景</span><span class="icon small" data-icon="chevron-down"></span></button>
      <button class="button ghost" data-action="goto" data-page="agents"><span class="icon" data-icon="bot"></span><span>AI Agent</span></button>
      <button class="button ghost" data-action="theme" aria-label="切换明暗主题"><span class="icon" data-icon="eye"></span></button>
      <button class="button ghost" data-action="goto" data-page="models" aria-label="打开设置"><span class="icon" data-icon="settings"></span></button>
      <button id="ask-ai" class="button ai-entry" data-action="open-ai"><span class="icon" data-icon="wand-sparkles"></span>询问 AI<span id="entry-status" class="status-dot" hidden></span></button>
    </div>
    <div id="scene-menu" class="popover scene-popover" hidden></div>
  </header>
  <div class="app-body">
    <aside id="sidebar" class="app-sidebar" aria-label="主导航"></aside>
    <main id="view" class="workspace"></main>
    <div id="ai-mask" class="ai-mask" data-action="close-ai" hidden></div>
    <aside id="ai-panel" class="ai-panel" aria-label="询问 AI" hidden></aside>
  </div>
  <footer class="app-status"><span class="status-dot green"></span><span id="status-target">Docker MySQL · demo_shop</span><span class="status-separator">|</span><span class="prototype-note">交互原型 · 数据、模型、工具与 MCP 执行均为模拟</span><span class="status-right">UTF-8<span>北京时间</span></span></footer>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>
</body>
</html>
