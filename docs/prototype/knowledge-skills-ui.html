<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fluxDB · 知识与技能</title>
  <link rel="stylesheet" href="knowledge-skills-ui.css">
  <script src="knowledge-skills-ui.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
      <strong>fluxDB</strong><span class="title-divider"></span>
      <span class="title-path">资源工作台 <span>/</span> 知识与技能</span>
      <span class="prototype-label">设计预览</span>
      <div class="title-actions">
        <button class="icon-btn" id="theme-toggle" aria-label="切换明暗主题" title="切换明暗主题" data-icon="sun"></button>
        <button class="btn ask-btn" id="preview-top"><span data-icon="sparkles"></span>上下文预览</button>
      </div>
    </header>
    <div class="workspace">
      <nav class="rail" aria-label="主导航">
        <button class="rail-item" data-nav="home" aria-label="首页" title="首页"><span data-icon="home"></span><small>首页</small></button>
        <button class="rail-item" data-nav="database" aria-label="数据库" title="数据库"><span data-icon="database"></span><small>数据库</small></button>
        <button class="rail-item active" data-nav="library" aria-current="page" aria-label="知识与技能" title="知识与技能"><span data-icon="library"></span><small>知识技能</small></button>
        <div class="rail-bottom"><button class="rail-item" data-nav="settings" aria-label="设置" title="设置"><span data-icon="settings"></span></button></div>
      </nav>
      <aside class="library-nav" aria-label="资源分类">
        <div class="nav-title"><span>知识与技能</span><span class="library-mark" data-icon="library"></span></div>
        <div class="nav-section-label">资源库</div>
        <div id="category-nav"></div>
        <div class="nav-section-label scope-heading">适用资源 <button class="icon-btn small" id="reset-filter" aria-label="重置筛选" title="重置筛选" data-icon="rotate"></button></div>
        <div id="scope-nav"></div>
        <div class="nav-bottom-note"><span data-icon="link"></span><p>内容独立维护<br>跟随当前资源，按需使用</p></div>
      </aside>
      <main class="main">
        <section class="page-heading">
          <div><div class="eyebrow">RESOURCE LIBRARY</div><h1>知识与技能</h1><p>让 AI 理解你的业务，也知道如何完成任务。</p></div>
          <div class="heading-actions">
            <button class="btn" id="import-btn"><span data-icon="upload"></span>导入</button>
            <button class="btn primary" id="new-btn"><span data-icon="plus"></span>新建资源</button>
            <input type="file" id="import-file" accept=".md,.txt" hidden>
          </div>
        </section>
        <section class="context-bar" aria-label="当前工作上下文">
          <span class="context-dot"></span>
          <span class="context-caption">当前活跃</span>
          <span data-icon="table" id="active-icon"></span><strong id="active-name"></strong>
          <span class="context-secondary" id="active-path"></span>
          <span class="context-count" id="active-count"></span>
          <button class="text-btn" id="open-preview">预览 AI 可见内容<span data-icon="arrow-right"></span></button>
        </section>
        <div class="mobile-filters">
          <select id="mobile-category" aria-label="资源类型筛选"><option value="all">全部资源</option><option value="knowledge">业务知识</option><option value="skill">Skills</option><option value="proposed">待确认</option><option value="retired">已停用</option></select>
          <select id="mobile-scope" aria-label="适用资源筛选"><option value="all">全部适用资源</option><option value="database">数据库</option><option value="ssh">SSH 主机</option><option value="api">API 接口</option><option value="global">通用</option></select>
        </div>
        <div class="resource-layout">
          <section class="resource-list-panel" aria-label="资源列表">
            <div class="list-toolbar"><label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="搜索名称或说明" aria-label="搜索资源"><kbd>⌘ K</kbd></label></div>
            <div class="list-heading"><span id="list-heading">全部资源</span><span id="list-count"></span></div>
            <div class="resource-list" id="resource-list"></div>
            <div class="list-foot"><span data-icon="info"></span>示例内容 · 不连接真实数据源</div>
          </section>
          <article class="detail-panel" id="detail" aria-label="资源详情"></article>
        </div>
      </main>
    </div>
    <footer class="statusbar"><span class="status-left"><span class="status-dot"></span>本地资源库<span class="status-divider">|</span><span id="total-count"></span></span><span>交互原型 · 修改仅保留在当前页面，不读取或上传实际资源</span><span class="status-right">UTF-8</span></footer>
  </div>
  <div id="sheet-root"></div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
