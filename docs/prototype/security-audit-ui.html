<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fluxDB · 调用前安全审计 · UI 交互稿</title>
<style>
:root{
  --app:#f5f5f5;--canvas:#f6f7f9;--side:#f2f3f5;--panel:#fff;--alt:#f4f6f8;
  --border:#d4d8de;--line:#e5e9ef;--text:#20242a;--muted:#737985;--hover:#e9edf3;
  --selected:#e7eef5;--brand:#365e84;--brand-text:#fff;--brand-soft:#edf3f9;
  --ok:#267352;--ok-soft:#e9f5ee;--warn:#99651e;--warn-soft:#fcf3e3;
  --danger:#a43c3c;--danger-soft:#faecec;--code:#f5f7fa;--shadow:0 10px 32px #17233018;
  --mask:#11182226;--input:#fff;
  color-scheme:light;
}
html[data-theme="dark"]{
  --app:#101214;--canvas:#121417;--side:#171a1f;--panel:#1b1f25;--alt:#232832;
  --border:#343a44;--line:#2a3038;--text:#e6e8ec;--muted:#9aa3af;--hover:#252b34;
  --selected:#273849;--brand:#88afd7;--brand-text:#111923;--brand-soft:#203143;
  --ok:#87c7a4;--ok-soft:#21352c;--warn:#d9b27b;--warn-soft:#382f24;
  --danger:#e49a9a;--danger-soft:#3a282b;--code:#14191f;--shadow:0 10px 36px #0005;
  --mask:#05080c60;--input:#12161b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--app)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
[hidden]{display:none!important}

/* ---- 外壳 ---- */
.shell{height:100%;display:flex;flex-direction:column}
.top{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.dots{display:flex;gap:7px}
.dots i{width:10px;height:10px;border-radius:50%;background:#f06b64}
.dots i:nth-child(2){background:#e8bd51}.dots i:nth-child(3){background:#67bd6a}
.brand{font-weight:600}
.sep{height:16px;border-left:1px solid var(--border)}
.path{font-size:12px;color:var(--muted)}
.spacer{margin-left:auto}
.switch-btn{height:30px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;border:1px solid var(--border);background:var(--panel);border-radius:7px}
.seg{display:inline-flex;background:var(--alt);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 13px;border-radius:6px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px #00000014}
.stage{flex:1;overflow:auto;padding:26px 30px 60px}
.wrap{max-width:1180px;margin:0 auto}

/* ---- 通用 ---- */
.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:5px;font-size:11px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.tag.green{color:var(--ok);background:var(--ok-soft)}
.tag.amber{color:var(--warn);background:var(--warn-soft)}
.tag.red{color:var(--danger);background:var(--danger-soft)}
.tag.blue{color:var(--brand);background:var(--brand-soft)}
.tag.plain{color:var(--muted);border-color:var(--border);background:transparent}
.muted{color:var(--muted)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}
.hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.hd h2{font-size:14px;font-weight:650}
.note{display:flex;gap:9px;padding:11px 14px;border-radius:9px;background:var(--alt);border:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.6}
.note b{color:var(--text);font-weight:600}
.i{width:15px;height:15px;flex:none;margin-top:1px}

/* ================= 界面一：规则配置弹框 ================= */
.dlg{max-width:940px;margin:0 auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.dlg-head{display:flex;align-items:center;gap:13px;padding:18px 22px;border-bottom:1px solid var(--line)}
.glyph{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.dlg-head h1{font-size:15px;font-weight:650}
.dlg-head p{font-size:12px;color:var(--muted);margin-top:2px}

/* 顶部实时摘要：一眼看到"现在生效几条规则" */
.summary{display:flex;align-items:center;gap:12px;padding:14px 22px;background:linear-gradient(90deg,var(--brand-soft),transparent 62%);border-bottom:1px solid var(--line)}
.summary .count{font-size:24px;font-weight:680;letter-spacing:-.02em;line-height:1}
.summary .txt{font-size:12px;color:var(--muted)}
.summary .chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;background:var(--panel);border:1px solid var(--border);font-size:11px;font-weight:600}
.chip .d{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.chip.on .d{background:var(--ok)}
.chip.off{opacity:.55}

/* 分组：把 8 条规则从"一长条"变成 3 块可扫读 */
.body{padding:6px 22px 4px;max-height:60vh;overflow:auto}
.group{padding:16px 0 4px}
.group:not(:last-child){border-bottom:1px dashed var(--line)}
.group-head{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.group-head h3{font-size:12px;font-weight:680;letter-spacing:.02em}
.group-head .bar{width:3px;height:14px;border-radius:2px;background:var(--brand)}
.group-head .cnt{font-size:11px;color:var(--muted);margin-left:auto}

.rule{display:grid;grid-template-columns:236px 1fr;gap:8px 20px;align-items:start;padding:12px 12px;border-radius:10px}
.rule:hover{background:var(--hover)}
.rule .lab{padding-top:7px}
.rule .lab .t{font-weight:600;display:flex;align-items:center;gap:7px}
.rule .lab .t .dot{width:6px;height:6px;border-radius:50%;background:var(--border)}
.rule.active .lab .t .dot{background:var(--ok)}
.rule .lab .s{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.ctl{display:flex;flex-direction:column;gap:7px}
textarea,input.txt{width:100%;background:var(--input);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:12.5px;line-height:1.6;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea::placeholder,input.txt::placeholder{color:var(--muted);opacity:.65}
textarea:focus,input.txt:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.two{min-height:56px}
textarea.one{min-height:40px}
/* 开关：右侧对齐、带状态字 */
.toggle-row{display:flex;align-items:center;gap:10px;padding-top:5px}
.tsw{position:relative;width:40px;height:23px;border-radius:999px;background:var(--border);transition:background .16s;border:0;flex:none}
.tsw::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .16s;box-shadow:0 1px 3px #0003}
.tsw.on{background:var(--brand)}
.tsw.on::after{transform:translateX(17px)}
.tstate{font-size:11.5px;color:var(--muted)}
.parsed{display:flex;gap:6px;flex-wrap:wrap}
.parsed .p{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--code);border:1px solid var(--line);font-size:11px;font-family:ui-monospace,Menlo,monospace;color:var(--muted)}

.dlg-foot{display:flex;align-items:center;gap:12px;padding:14px 22px;border-top:1px solid var(--line);background:var(--alt)}
.dlg-foot .hint{font-size:11.5px;color:var(--muted)}
.btn{height:32px;padding:0 15px;border-radius:8px;border:1px solid var(--border);background:var(--panel);font-weight:600}
.btn.primary{background:var(--brand);color:var(--brand-text);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}

/* ================= 界面二：审计记录页 ================= */
.page-hd{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.page-hd h1{font-size:19px;font-weight:660;letter-spacing:-.02em}
.page-hd p{font-size:12px;color:var(--muted);margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px;text-align:left;box-shadow:var(--shadow)}
.stat .k{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .v{font-size:22px;font-weight:680;margin-top:5px;letter-spacing:-.02em}
.stat.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.stat .k .d{width:6px;height:6px;border-radius:50%}
.stat.allow .k .d{background:var(--ok)}.stat.appr .k .d{background:var(--warn)}.stat.deny .k .d{background:var(--danger)}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.toolbar .grow{flex:1}
.search{width:260px;height:32px;border:1px solid var(--border);background:var(--input);border-radius:8px;padding:0 11px;font-size:12.5px;display:flex;align-items:center;gap:8px;color:var(--muted)}

table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--hover)}
tbody tr.open{background:var(--selected)}
.tool{font-weight:600}
.src{font-size:11px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px}
.rule-cell{font-size:11.5px;font-family:ui-monospace,Menlo,monospace;color:var(--muted)}
.why{display:flex;flex-direction:column;gap:7px;padding:0 16px 16px}
.why .line{display:flex;gap:10px;font-size:12px}
.why .line .k{width:96px;flex:none;color:var(--muted)}
.code{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty .ico{width:46px;height:46px;margin:0 auto 12px;border-radius:12px;display:grid;place-items:center;background:var(--alt);border:1px solid var(--line)}

svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="dots"><i></i><i></i><i></i></div>
    <strong class="brand">fluxDB</strong><span class="sep"></span>
    <span class="path" id="path">设置 / 工具与 MCP / 安全审计</span>
    <div class="spacer"></div>
    <div class="seg" id="screen-seg">
      <button class="on" data-screen="rules">规则配置</button>
      <button data-screen="records">审计记录</button>
    </div>
    <button class="switch-btn" id="theme">主题</button>
  </header>

  <div class="stage"><div class="wrap" id="root"></div></div>
</div>

<script>
const I = {
  shield:'<svg viewBox="0 0 24 24" class="i"><path d="M12 3l7 3v6c0 4.4-3 7.5-7 9-4-1.5-7-4.6-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  info:'<svg viewBox="0 0 24 24" class="i"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  table:'<svg viewBox="0 0 24 24" class="i"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>',
  columns:'<svg viewBox="0 0 24 24" class="i"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M3 9h18"/></svg>',
  pen:'<svg viewBox="0 0 24 24" class="i"><path d="M4 20h4L20 8l-4-4L4 16z"/></svg>',
  key:'<svg viewBox="0 0 24 24" class="i"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3M15 12v2"/></svg>',
  search:'<svg viewBox="0 0 24 24" class="i"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  empty:'<svg viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M4 7h16v13H4z"/><path d="M4 7l2-3h12l2 3M9 12h6"/></svg>',
  chev:'<svg viewBox="0 0 24 24" class="i"><path d="M6 9l6 6 6-6"/></svg>',
};

// ---------- 界面一：规则配置 ----------
function rulesScreen(){
  const groups = [
    {name:'数据范围', icon:I.table, items:[
      {t:'禁止访问的表', s:'读写都拒绝；裸名匹配任意 schema，schema.表名 只匹配该 schema', on:true,
       c:`<textarea class="two" placeholder="例如 audit_logs&#10;event_logs">audit_logs
login_attempts</textarea>
       <div class="parsed"><span class="muted" style="font-size:11px">解析为</span>
         <span class="p">audit_logs</span><span class="p">login_attempts</span></div>`},
      {t:'允许访问的表', s:'白名单：不在名单里的表一律拒绝；留空表示不限制', on:false,
       c:`<textarea class="one" placeholder="留空 = 不限制"></textarea>`},
      {t:'只读保护的表', s:'允许查询，但任何写入都拒绝', on:false,
       c:`<textarea class="one" placeholder="例如 customers"></textarea>`},
      {t:'禁止访问的列', s:'语句里出现这些列即拒绝；裸列名匹配任意表', on:true,
       c:`<textarea class="two" placeholder="例如 cost_price&#10;orders.supplier_id">cost_price</textarea>
       <div class="parsed"><span class="muted" style="font-size:11px">命中示例</span>
         <span class="p">SELECT id, cost_price FROM orders</span></div>`},
    ]},
    {name:'写入与结构', icon:I.pen, items:[
      {t:'禁止结构变更', s:'拒绝 CREATE / ALTER / DROP / TRUNCATE / GRANT 等结构与管理语句', on:true,
       c:`<div class="toggle-row"><button class="tsw on" onclick="this.classList.toggle('on')"></button><span class="tstate">已开启 · DDL 直接拒绝</span></div>`},
      {t:'写操作必须带条件', s:'没有 WHERE 的 UPDATE / DELETE 转为待审批，而不是直接拒绝', on:true,
       c:`<div class="toggle-row"><button class="tsw on" onclick="this.classList.toggle('on')"></button><span class="tstate">已开启 · 无谓词写入转人工</span></div>`},
    ]},
    {name:'Redis', icon:I.key, items:[
      {t:'禁止的 Redis 命令', s:'一行一个命令名，不区分大小写；叠加在内核拒绝列表之上', on:false,
       c:`<textarea class="one" placeholder="例如 KEYS&#10;FLUSHALL"></textarea>`},
      {t:'禁止的 Redis Key 前缀', s:'命令触碰任一以此开头的 Key 即拒绝', on:false,
       c:`<textarea class="one" placeholder="例如 prod:session:"></textarea>`},
    ]},
  ];
  const active = 4;
  return `
  <div class="dlg">
    <div class="dlg-head">
      <div class="glyph">${I.shield}</div>
      <div><h1>调用前安全审计</h1><p>配置项由插件声明；填写后作用于每一次工具调用的最终计划。留空即不拦截。</p></div>
    </div>

    <div class="summary">
      <div><div class="count">${active}</div><div class="txt">条规则生效中 · 其余留空不拦截</div></div>
      <div class="chips">
        <span class="chip on"><span class="d"></span>禁止 2 张表</span>
        <span class="chip on"><span class="d"></span>禁止 1 个列</span>
        <span class="chip on"><span class="d"></span>DDL 拒绝</span>
        <span class="chip on"><span class="d"></span>无谓词写入转审批</span>
        <span class="chip off"><span class="d"></span>Redis 未限制</span>
      </div>
    </div>

    <div class="body">
      ${groups.map(g=>`
        <div class="group">
          <div class="group-head"><span class="bar"></span><h3>${g.name}</h3>
            <span class="cnt">${g.items.filter(i=>i.on).length}/${g.items.length} 生效</span></div>
          ${g.items.map(it=>`
            <div class="rule ${it.on?'active':''}">
              <div class="lab">
                <div class="t"><span class="dot"></span>${it.t}</div>
                <div class="s">${it.s}</div>
              </div>
              <div class="ctl">${it.c}</div>
            </div>`).join('')}
        </div>`).join('')}
    </div>

    <div class="dlg-foot">
      <span class="hint">规则变更在下一个工具调用边界生效；参数或目标变化会让旧审计与审批失效。</span>
      <div class="spacer"></div>
      <button class="btn ghost">取消</button>
      <button class="btn primary">保存</button>
    </div>
  </div>`;
}

// ---------- 界面二：审计记录 ----------
const RECORDS = [
  {tool:'db.query', origin:'内部 Agent', target:'MySQL / demo_shop', decision:'allow', rule:'allowed_tables',
   sql:'SELECT channel, SUM(amount) FROM orders WHERE status = ? GROUP BY channel;', hash:'3f9a2c7e10b4', ver:'kernel-audit-v1-8c41f2', code:'table_in_allowlist'},
  {tool:'db.execute', origin:'内部 Agent', target:'MySQL / demo_shop', decision:'approval', rule:'write_requires_where',
   sql:"UPDATE orders SET status = 'reviewed';", hash:'a17b90d3ee52', ver:'kernel-audit-v1-8c41f2', code:'write_without_predicate'},
  {tool:'db.execute', origin:'Claude Code / MCP', target:'MySQL / demo_shop', decision:'deny', rule:'protected_tables',
   sql:"UPDATE customers SET tier = 'vip' WHERE id = 42;", hash:'77c1e8a4dd09', ver:'kernel-audit-v1-8c41f2', code:'protected_table_write:customers'},
  {tool:'redis.execute', origin:'Claude Code / MCP', target:'Redis / DB 0', decision:'deny', rule:'denied_redis_commands',
   sql:'FLUSHALL', hash:'0be4f1c9927a', ver:'kernel-audit-v1-8c41f2', code:'denied_command:flushall'},
  {tool:'db.query', origin:'内部 Agent', target:'MySQL / demo_shop', decision:'allow', rule:'—',
   sql:'SELECT id, name FROM orders LIMIT 50;', hash:'d2019ab7f34c', ver:'kernel-audit-v1-8c41f2', code:''},
];
const BADGE = {allow:['允许','green'], approval:['需审批','amber'], deny:['拒绝','red']};

function recordsScreen(){
  const counts = {all:RECORDS.length, allow:0, approval:0, deny:0};
  RECORDS.forEach(r=>counts[r.decision]++);
  const rows = RECORDS.map((r,i)=>`
    <tr class="row" onclick="toggleRow(${i})">
      <td style="width:236px">
        <div class="tool mono">${r.tool}</div>
        <div class="src">${r.origin} · <span class="mono">audit-${String(i+1).padStart(3,'0')}</span></div>
      </td>
      <td style="width:180px">${r.target}</td>
      <td style="width:110px"><span class="tag ${BADGE[r.decision][1]}">${BADGE[r.decision][0]}</span></td>
      <td><div class="rule-cell">${r.rule}</div></td>
      <td style="width:70px;text-align:right"><span class="muted" style="font-size:11px">详情</span></td>
    </tr>
    <tr class="detail" id="d${i}" hidden><td colspan="5" style="padding:0;background:var(--selected)">
      <div class="why">
        <div class="line"><span class="k">最终计划</span><div class="code" style="flex:1">${r.sql.replace(/</g,'&lt;')}</div></div>
        <div class="line"><span class="k">匹配规则</span><span class="mono">${r.rule}${r.code?' · '+r.code:''}</span></div>
        <div class="line"><span class="k">plan hash</span><span class="mono muted">${r.hash} · 规则集 ${r.ver}</span></div>
        <div class="line"><span class="k">说明</span><span class="muted">审计只记录规则与对象，不含 SQL 原文之外的参数值、密钥或密文。</span></div>
      </div></td></tr>`).join('');

  return `
  <div class="page-hd">
    <div><h1>安全审计</h1><p>在最终参数修改之后、实际执行之前判定；Jev 与普通插件不能覆盖拒绝。</p></div>
  </div>

  <div class="notice" style="margin-bottom:16px">${I.shield}
    <div><b>安全审计始终开启（只读）</b><br>参数或目标变化会让旧审计与审批失效；审计无法执行或保存时，操作不会继续。规则在「内置插件 → 调用前安全审计 → 管理」中调整。</div>
  </div>

  <div class="stats">
    <button class="stat sel"><div class="k">全部判断</div><div class="v">${counts.all}</div></button>
    <button class="stat allow"><div class="k"><span class="d"></span>允许</div><div class="v">${counts.allow}</div></button>
    <button class="stat appr"><div class="k"><span class="d"></span>需审批</div><div class="v">${counts.approval}</div></button>
    <button class="stat deny"><div class="k"><span class="d"></span>拒绝</div><div class="v">${counts.deny}</div></button>
  </div>

  <div class="toolbar">
    <div class="search">${I.search}<span>搜索工具、目标或规则</span></div>
    <div class="grow"></div>
    <span class="muted" style="font-size:11.5px">保留最近 200 条 · 仅追加，不可修改</span>
  </div>

  <div class="box">
    <table>
      <thead><tr><th>调用 / 来源</th><th>目标</th><th>判断</th><th>匹配规则</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function toggleRow(i){const el=document.getElementById('d'+i);el.hidden=!el.hidden;el.previousElementSibling.classList.toggle('open',!el.hidden);}

let screen = location.hash === '#records' ? 'records' : 'rules';
function draw(){
  document.getElementById('root').innerHTML = screen==='rules'?rulesScreen():recordsScreen();
  document.getElementById('path').textContent = screen==='rules'
    ? '设置 / 工具与 MCP / 内置插件 / 调用前安全审计'
    : '设置 / 工具与 MCP / 安全审计';
}
document.getElementById('screen-seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  screen=b.dataset.screen;
  document.querySelectorAll('#screen-seg button').forEach(x=>x.classList.toggle('on',x===b));
  draw();
});
document.querySelectorAll('#screen-seg button').forEach(b=>b.classList.toggle('on', b.dataset.screen===screen));
window.addEventListener('hashchange',()=>{
  screen = location.hash === '#records' ? 'records' : 'rules';
  document.querySelectorAll('#screen-seg button').forEach(x=>x.classList.toggle('on', x.dataset.screen===screen));
  draw();
});
document.getElementById('theme').addEventListener('click',()=>{
  const h=document.documentElement;
  h.dataset.theme = h.dataset.theme==='dark'?'light':'dark';
});
// 支持 ?theme=dark 直接以暗色打开（截图与分享用）。
if(new URLSearchParams(location.search).get('theme')==='dark'){document.documentElement.dataset.theme='dark';}
draw();
</script>
</body>
</html>
